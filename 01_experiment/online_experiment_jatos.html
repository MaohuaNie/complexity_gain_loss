const domains       = ["gain", "loss"];
const mainOptions   = ["A", "B"];
const mainVariants  = ["complex", "simple"];

const N_MAIN_TRIALS  = 27;  // 0 .. 26  → gain_000_*, ..., gain_026_*
const N_CATCH_TRIALS = 4;   // 1 .. 4   → gain001_catch_*, ..., gain004_catch_*
const N_PRAC_TRIALS  = 24;  // 0 .. 23  → gain000_*, ..., gain023_*


// ----------------------- main experimental images ---------------------------
for (const domain of domains) {
  // main trials: png/gain/gain_000_A_complex.png, etc.
  for (let i = 0; i < N_MAIN_TRIALS; i++) {
    const num = String(i).padStart(3, "0");
    for (const opt of mainOptions) {
      for (const v of mainVariants) {
        preloadImages.push(`png/${domain}/${domain}_${num}_${opt}_${v}.png`);
      }
    }
  }

  // catch trials: png/gain/catch/gain001_catch_A_complex.png, etc.
  for (let i = 1; i <= N_CATCH_TRIALS; i++) {
    const num = String(i).padStart(3, "0");
    for (const opt of mainOptions) {
      for (const v of mainVariants) {
        preloadImages.push(
          `png/${domain}/catch/${domain}${num}_catch_${opt}_${v}.png`
        );
      }
    }
  }
}


// ----------------------- practice / instruction images ----------------------
for (const domain of domains) {
  for (let i = 0; i < N_PRAC_TRIALS; i++) {
    const idx = String(i).padStart(3, "0");
    for (const opt of mainOptions) {
      for (const v of mainVariants) {
        // e.g. ins_prac/gain000_A_complex.png
        preloadImages.push(`ins_prac/${domain}${idx}_${opt}_${v}.png`);
      }
    }
  }
}

function handleKeyResponse(event) {
    var data = jsPsych.getCurrentTrial().data;
    if (event.key === 'f' || event.key === 'j') {
        // Remove the event listener to prevent multiple responses
        document.removeEventListener('keydown', handleKeyResponse);

        // Record the time of the response
        var responseTime = Date.now();
        // Record the response
        data.response = event.key;
        data.test_chosen_option = event.key === 'f' ? 'optionA' : 'optionB';

        // Generate feedback based on the response
        var new_color1 = data.test_chosen_option === 'optionA' ? 'CornflowerBlue' : 'white';
        var new_color2 = data.test_chosen_option === 'optionB' ? 'CornflowerBlue' : 'white';

        var currentTrial = jsPsych.getCurrentTrial();
        var optionAStimulus = currentTrial.optionA_Stimulus;
        var optionBStimulus = currentTrial.optionB_Stimulus;
        var trialNumberText = "Trial " + currentTrial.current_trial_number + " / 62"; // Retrieve trial number

        // Feedback HTML updated to match main experiment layout
        var feedbackHtml =
            '<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">' +
                '<div style="color:black;font-size:20px;line-height:1.5; text-align:center;">' +
                    '<p><b>' + trialNumberText + '</b></p>' +
                    '<p>Please choose the option that you prefer.</p>' +

                    // Options with centered layout and gap
                    '<div style="display: flex; justify-content: center; align-items: center; gap: 250px; margin-top: 20px;">' +
                        '<div id="optionA" class="option-container" ' +
                            'style="background-color: ' + new_color1 + '; text-align: center; padding: 10px;">' +
                            '<img style="max-width:2000px; width: 80%; height: auto;" src="' + optionAStimulus + '" />' +
                        '</div>' +
                        '<div id="optionB" class="option-container" ' +
                            'style="background-color: ' + new_color2 + '; text-align: center; padding: 10px;">' +
                            '<img style="max-width:2000px; width: 80%; height: auto;" src="' + optionBStimulus + '" />' +
                        '</div>' +
                    '</div>' +

                    // F/J labels with symmetric spacing
                    '<div style="display: flex; justify-content: center; margin-top: 40px; gap: 500px;">' +
                        '<p><b>Press F to choose the left option</b></p>' +
                        '<p><b>Press J to choose the right option</b></p>' +
                    '</div>' +
                '</div>' +

                '<div style="margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;">' +
                    '<div id="warningMessage" style="color: black; font-size: 20px; display: none; margin-bottom: 20px;">5 seconds left to make a decision</div>' +
                    '<button id="nextButton" style="display: none; color: black; font-size: 40px; align-self: center;" onclick="jsPsych.finishTrial()">Go to next trial</button>' +
                '</div>' +
            '</div>';

        // Display the feedback
        jsPsych.getDisplayElement().innerHTML = feedbackHtml;

        // Wait for the feedback to be displayed for a certain duration
        setTimeout(function() {
            // Clear the display for the post-trial duration
            jsPsych.getDisplayElement().innerHTML = '';

            // Then wait for the post-trial duration before ending the trial
            setTimeout(function() {
                // Calculate reaction time
                var rt = responseTime - trialStartTime;

                // End the trial and include the reaction time in the data
                jsPsych.finishTrial({ rt_trial: rt, feedback: feedbackHtml, after_warning: warningShown });
                console.log(rt);
            }, 800); // Post-trial duration
        }, 800); // Feedback display duration
    }
}

// --- Helper: remove catch trials (skew === 'catch') ---
function dropCatchTrials(list) {
  return list.filter(t => !t.data || t.data.skew !== 'catch');
}

// --- Helper: make option-level list (A = uncertain, B = sure) ---
function toOptionLevel(list) {
  const out = [];
  list.forEach(t => {
    const [imgA, imgB] = t.stimulus.split(',').map(s => s.trim());
    const baseData = t.data || {};

    // Uncertain (Option A)
    const uncertainComplexity = /_complex\.png$/i.test(imgA) ? 'complex' : 'simple';
    out.push({
      stimulus: imgA,
      data: {
        ...baseData,
        option_certainty: 'uncertain',
        option_complexity: uncertainComplexity,
        source_pair: t.stimulus,
        F: t.F,
        J: t.J
      }
    });

    // Sure (Option B)
    const sureComplexity = /_complex\.png$/i.test(imgB) ? 'complex' : 'simple';
    out.push({
      stimulus: imgB,
      data: {
        ...baseData,
        option_certainty: 'sure',
        option_complexity: sureComplexity,
        source_pair: t.stimulus,
        F: t.F,
        J: t.J
      }
    });
  });
  return out;
}

// --- Helper: pick one random exemplar per (valence × certainty × complexity) ---
function pickOnePerCell(list) {
  const cells = {};
  list.forEach(t => {
    const valence   = t.data.test_part;          // "Gain" or "Loss"
    const certainty = t.data.option_certainty;   // uncertain / sure
    const complexity = t.data.option_complexity; // simple / complex
    const key = `${valence}_${certainty}_${complexity}`;
    if (!cells[key]) cells[key] = [];
    cells[key].push(t);
  });

  const selected = [];
  Object.keys(cells).forEach(key => {
    const arr = cells[key];
    const idx = Math.floor(Math.random() * arr.length);
    selected.push(arr[idx]);
  });
  return selected;
}

        var p1 = Number(o.probB1), pay1 = Number(o.payB1);
        var p2 = Number(o.probB2), pay2 = Number(o.payB2);
      }

      // sanity fallbacks
      if (!Number.isFinite(p1) || !Number.isFinite(p2) ||
          !Number.isFinite(pay1) || !Number.isFinite(pay2)) {
        // fallback to 0 if malformed
        return 0;
      }

      // make sure probs sum to ~1 (tolerate rounding)
      const ps = p1 + p2;
      if (Math.abs(ps - 1) > 1e-6) {
        // normalize softly
        p1 = p1 / ps;
        p2 = p2 / ps;
      }

      const r = Math.random();
      return (r <= p1) ? pay1 : pay2;
    }
    console.log(random_trial)

    const selectedPay = drawTwoOutcomePay(random_trial, resp_for_pay);

    // components in pence
